name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.0.0 (got '${{ inputs.version }}')"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    # windows is best-effort; a failure there shouldn't block mac/linux artifacts
    continue-on-error: ${{ matrix.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: pnpm/action-setup@v4
        with:
          # pinned to match the pnpm version the lockfile (patchedDependencies
          # hashes especially) was generated with — a major-version mismatch
          # makes `pnpm install --frozen-lockfile` fail with
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH even though nothing is actually stale
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Stamp version
        shell: bash
        run: |
          sed -i.bak "s/^version: .*/version: ${{ inputs.version }}/" release.config.yaml

      - name: Build (macOS universal)
        if: matrix.platform == 'mac'
        run: make darwin

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        # ubuntu-latest only ships libwebkit2gtk-4.1-dev now; this tag tells
        # wails/go to build against that instead of the removed 4.0 headers
        run: make build TAGS=webkit2_41

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: make build

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'mac'
        with:
          name: bish-${{ inputs.version }}-mac
          path: build/bin/bish.app

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: bish-${{ inputs.version }}-linux
          path: build/bin/bish

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: bish-${{ inputs.version }}-windows
          path: build/bin/bish.exe
